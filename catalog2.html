<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Каталог — HOP & BARREL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter&display=swap" rel="stylesheet">

  <style>
    /* кнопки */
    .btn-craft {position:relative; overflow:hidden; transition:transform .25s cubic-bezier(.4,0,.2,1),box-shadow .25s ease,background .3s ease;}
    .btn-craft::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.25),transparent 70%);transform:translateX(-100%);transition:transform .6s ease;}
    .btn-craft:hover::after{transform:translateX(100%);}
    .btn-craft:hover{transform:translateY(-3px) scale(1.02); box-shadow:0 18px 40px rgba(0,0,0,.35);}
    .btn-craft:active{transform:scale(0.97);}

    .product-card{transition:transform .3s ease,box-shadow .3s ease;}
    .product-card:hover{transform:translateY(-8px);box-shadow:0 25px 60px rgba(0,0,0,.4);}

    .fade-up{opacity:0;transform:translateY(40px);transition:all .8s cubic-bezier(.4,0,.2,1);}
    .fade-up.show{opacity:1;transform:translateY(0);}
    
    /* Корзина */
    #cart {transition: opacity .3s ease;}
  </style>
</head>
<body class="font-body bg-slate-50">

<header class="sticky top-0 bg-white shadow z-40">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
    <span class="font-heading text-2xl">HOP & BARREL</span>
    <button onclick="toggleCart()" class="hidden md:block font-semibold">Корзина (<span id="cartCount">0</span>)</button>
  </div>
</header>

<section class="max-w-7xl mx-auto px-6 py-10 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-8 pb-24 fade-up">

<!-- Товар -->
<div class="product-card bg-white rounded-2xl shadow hover:shadow-xl transition">
  <img src="https://i.pinimg.com/originals/db/35/9a/db359a8ae87f8a076305374c30765d85.jpg" class="rounded-t-2xl h-48 w-full object-cover">
  <div class="p-4">
    <h3 class="font-semibold mb-1">IPA Classic</h3>
    <p class="text-sm text-slate-600">0.5 л • 6.5%</p>
    <button onclick="addToCart('IPA Classic')" class="btn-craft mt-4 w-full bg-amber-500 py-2 rounded-lg font-semibold">В корзину</button>
  </div>
</div>

<!-- Добавьте сюда остальные товары -->

</section>

<!-- MOBILE CART BUTTON -->
<button onclick="toggleCart()" class="fixed bottom-4 left-4 right-4 bg-slate-900 text-white py-4 rounded-xl font-semibold md:hidden">🧺 Корзина (<span id="cartCountMobile">0</span>)</button>

<!-- CART MODAL -->
<div id="cart" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center">
  <div class="bg-white rounded-2xl p-6 w-full max-w-md mx-4">
    <h2 class="font-heading text-2xl mb-4">Ваш заказ</h2>
    <ul id="cartItems" class="mb-4 text-sm"></ul>
    <input id="phone" placeholder="Телефон" class="w-full border p-3 rounded-lg mb-4">
    <button onclick="sendOrder()" class="w-full btn-craft bg-amber-500 py-3 rounded-lg font-semibold">Оформить заказ</button>
    <button onclick="toggleCart()" class="w-full mt-3 text-sm">Закрыть</button>
  </div>
</div>

<script>
const ADMIN_TG = "hopbarrel_admin";
let cart = [];

function addToCart(name){cart.push(name);updateCount();renderCart();}
function updateCount(){document.getElementById("cartCount").innerText=cart.length;document.getElementById("cartCountMobile").innerText=cart.length;}
function toggleCart(){document.getElementById("cart").classList.toggle("hidden");renderCart();}
function renderCart(){const list=document.getElementById("cartItems");list.innerHTML=cart.map(i=>`<li>• ${i}</li>`).join("");}
function sendOrder(){const phone=document.getElementById("phone").value;if(!phone||!cart.length)return alert("Заполните телефон и добавьте товары");const text=`Новый заказ:%0A${cart.join("%0A")}%0A%0AТелефон: ${phone}`;window.location.href=`https://t.me/${ADMIN_TG}?text=${text}`;alert("✅ Заказ оформлен, мы с вами свяжемся");cart=[];updateCount();toggleCart();}

// fade-up анимация
const observer=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting)entry.target.classList.add("show");});},{threshold:0.15});
document.querySelectorAll(".fade-up").forEach(el=>observer.observe(el));
</script>

</body>
</html>
