<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>PLANBEER — Пиво с характером</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { 
      font-family: 'Inter', sans-serif;
      width: 100%;
      overflow-x: hidden;
    }

    /* Бегущая строка */
    .ticker {
      background: #f59e0b;
      color: #000;
      padding: 12px 0;
      overflow: hidden;
      white-space: nowrap;
    }
    .ticker.hidden { display: none; }
    .ticker-inner {
      display: inline-block;
      animation: scroll 40s linear infinite;
    }
    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* Кнопки */
    .btn {
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    /* Анимации */
    .fade-up {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.6s ease;
    }
    .fade-up.show {
      opacity: 1;
      transform: translateY(0);
    }


    /* Анимации появления */
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes fade-in-delay {
      0%, 20% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes scale-in {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    
    .animate-fade-in { animation: fade-in 0.8s ease-out; }
    .animate-fade-in-delay { animation: fade-in-delay 1.2s ease-out forwards; }
    .animate-scale-in { animation: scale-in 0.6s ease-out forwards; }

    /* Мобильная адаптация */
    @media (max-width: 768px) {
      h1 { font-size: 2.5rem !important; }
      h2 { font-size: 2rem !important; }
      h3 { font-size: 1.75rem !important; }
      
      .ticker { padding: 8px 0; font-size: 14px; }
      
      section { padding-top: 3rem; padding-bottom: 3rem; }
    }
    
    @media (max-width: 480px) {
      h1 { font-size: 2rem !important; }
      .btn { width: 100%; text-align: center; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">

<!-- Верхняя бегущая строка -->
<div id="tickerTop" class="ticker hidden">
  <div class="ticker-inner" id="tickerTopInner"></div>
</div>

<!-- HERO -->
<section class="relative min-h-[70vh] sm:min-h-screen fade-up">
  <img id="heroImage" src="https://raw.githubusercontent.com/catthecat3/planbeer/main/slide1.jpg"
       class="absolute inset-0 w-full h-full object-cover">
  <div class="absolute inset-0 bg-black/70"></div>

  <div class="absolute inset-0 flex justify-center items-center">
    <div class="text-center px-6">
      <h1 class="text-5xl md:text-7xl font-bold mb-4 text-white animate-fade-in">PLAN BEER</h1>
      <p class="text-xl md:text-2xl text-slate-200 mb-2 animate-fade-in-delay">Пиво с характером</p>
      <p class="text-base md:text-lg text-slate-300 mb-8 animate-fade-in-delay">Классическое пиво в Альметьевске</p>

      <div class="flex flex-col sm:flex-row gap-4 items-center justify-center animate-scale-in" style="animation-delay: 0.4s;">
        <a href="catalog.html" class="btn bg-amber-500 hover:bg-amber-600 px-8 py-4 rounded-xl text-black font-semibold">
          Перейти в каталог
        </a>
        <a href="#contacts" class="btn border-2 border-white text-white hover:bg-white hover:text-black px-8 py-4 rounded-xl">
          Контакты
        </a>
      </div>

      <div class="flex gap-6 mt-8 text-white text-sm justify-center animate-fade-in-delay" style="animation-delay: 0.6s;">
        <a href="https://t.me/planbeermag" target="_blank" class="flex items-center gap-2 hover:text-amber-400 transition">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M9.999 15.17l-.397 4.06c.568 0 .814-.244 1.112-.536l2.668-2.53 5.53 4.04c1.014.56 1.734.266 1.99-.94L24 3.9c.33-1.51-.546-2.1-1.533-1.74L1.1 9.5c-1.47.57-1.45 1.38-.27 1.75l5.53 1.72L19.2 5.4c.61-.37 1.17-.17.71.21"/>
          </svg>
          Telegram
        </a>
        <a href="https://instagram.com/planbeermag" target="_blank" class="flex items-center gap-2 hover:text-amber-400 transition">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M7.75 2h8.5C19.55 2 22 4.46 22 7.75v8.5C22 19.55 19.54 22 16.25 22h-8.5C4.45 22 2 19.54 2 16.25v-8.5C2 4.45 4.46 2 7.75 2zm0 1.5A4.26 4.26 0 003.5 7.75v8.5A4.26 4.26 0 007.75 20.5h8.5a4.26 4.26 0 004.25-4.25v-8.5A4.26 4.26 0 0016.25 3.5zM12 7a5 5 0 110 10 5 5 0 010-10zm0 1.5a3.5 3.5 0 100 7 3.5 3.5 0 000-7zm5.25-.88a1.13 1.13 0 11-2.26 0 1.13 1.13 0 012.26 0z"/>
          </svg>
          Instagram
        </a>
      </div>
    </div>
  </div>

  <!-- Нижняя бегущая строка -->
  <div id="tickerBottom" class="ticker hidden absolute bottom-0 left-0 right-0">
    <div class="ticker-inner" id="tickerBottomInner"></div>
  </div>
</section>

<!-- О МАГАЗИНЕ -->
<section class="py-12 sm:py-20 fade-up">
  <div class="max-w-4xl mx-auto px-6 text-center">
    <h2 class="text-4xl font-bold mb-6">О магазине</h2>
    <p class="text-slate-600 text-lg max-w-2xl mx-auto" id="aboutText">
      Загрузка...
    </p>
  </div>
</section>

<!-- КОНТАКТЫ -->
<section id="contacts" class="bg-slate-900 text-white py-12 sm:py-20 fade-up">
  <div class="max-w-4xl mx-auto px-6 text-center">
    <h3 class="text-3xl font-bold mb-8">Контакты</h3>
    <p class="mb-3 text-lg" id="contactAddress">📍 Загрузка...</p>
    <p class="mb-3 text-lg" id="contactPhone">📞 Загрузка...</p>
    <p class="text-lg" id="contactHours">🕒 Загрузка...</p>
  </div>
</section>

<footer class="text-center py-6 text-sm text-slate-500">© 2026 PLANBEER • 18+</footer>

<script>
// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyBcGBRRqjAEomg6P0DvQoR-FrXsyFC7dXk",
  authDomain: "planbeer-218de.firebaseapp.com",
  databaseURL: "https://planbeer-218de-default-rtdb.firebaseio.com",
  projectId: "planbeer-218de",
  storageBucket: "planbeer-218de.firebasestorage.app",
  messagingSenderId: "571000195828",
  appId: "1:571000195828:web:bda2bbab90eb7eba182ca1"
};

let db = null;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
} catch(e) { 
  console.error('Firebase init error:', e); 
}

// Бегущая строка
function buildTicker(text, targetId) {
  const inner = document.getElementById(targetId);
  const unit = text + '        ✦        ';
  const copies = Math.max(10, Math.ceil(1000 / unit.length));
  inner.textContent = Array(copies).fill(unit).join('');
}

// Загрузка настроек
function loadSettings() {
  if (!db) return;

  // Hero фото
  db.ref('settings/hero_image').on('value', snap => {
    const url = snap.val();
    if (url) {
      document.getElementById('heroImage').src = url;
    }
  });

  // Верхняя строка
  db.ref('settings/ticker_top').on('value', snap => {
    const data = snap.val();
    const ticker = document.getElementById('tickerTop');
    if (data && data.enabled && data.text) {
      buildTicker(data.text, 'tickerTopInner');
      ticker.classList.remove('hidden');
    } else {
      ticker.classList.add('hidden');
    }
  });

  // Нижняя строка
  db.ref('settings/ticker_bottom').on('value', snap => {
    const data = snap.val();
    const ticker = document.getElementById('tickerBottom');
    if (data && data.enabled && data.text) {
      buildTicker(data.text, 'tickerBottomInner');
      ticker.classList.remove('hidden');
    } else {
      ticker.classList.add('hidden');
    }
  });

  // О магазине
  db.ref('settings/about_text').on('value', snap => {
    const text = snap.val();
    const defaultText = 'PLAN BEER — магазин пивных напитков с отобранным ассортиментом, где ценят вкус, свежесть и атмосферу.';
    document.getElementById('aboutText').textContent = text || defaultText;
  });

  // Контакты
  db.ref('settings/contacts').on('value', snap => {
    const data = snap.val();
    if (data) {
      document.getElementById('contactAddress').textContent = '📍 ' + (data.address || 'Альметьевск');
      document.getElementById('contactPhone').textContent = '📞 ' + (data.phone || '+7 (999) 123-45-67');
      document.getElementById('contactHours').textContent = '🕒 ' + (data.hours || '10:00 — 23:00');
    }
  });
}

// Анимации при скролле
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('show');
    }
  });
}, { threshold: 0.15 });

document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));

// Инициализация
loadSettings();
</script>

</body>
</html>
