<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Админ-панель — BeerShop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Montserrat', sans-serif; 
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #fff;
    }

    .btn-primary {
      background: linear-gradient(90deg, #fbbf24 0%, #f59e0b 100%);
      color: #000;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(251, 191, 36, 0.3);
    }

    .card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 24px;
    }

    .input-field {
      width: 100%;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      transition: all 0.3s;
    }

    .input-field:focus {
      outline: none;
      border-color: #fbbf24;
      box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.1);
    }

    .tab-btn {
      padding: 12px 24px;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
    }

    .tab-btn:hover { color: #fbbf24; }
    .tab-btn.active {
      color: #fbbf24;
      border-bottom-color: #fbbf24;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active { display: flex; }

    .modal-content {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>

<!-- Экран входа -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
  <div class="card max-w-md w-full">
    <div class="text-center mb-8">
      <div class="text-6xl mb-4">🔐</div>
      <h1 class="text-3xl font-bold mb-2">Вход в админ-панель</h1>
      <p class="text-slate-400">BeerShop</p>
    </div>
    
    <input type="password" id="passwordInput" placeholder="Введите пароль"
           class="input-field mb-4" onkeypress="if(event.key==='Enter') checkPassword()">
    
    <button onclick="checkPassword()" class="w-full btn-primary">
      Войти
    </button>
    
    <p class="text-center text-slate-500 text-sm mt-4">
      Пароль: <code class="bg-slate-800 px-2 py-1 rounded">admin123</code>
    </p>
  </div>
</div>

<!-- Админ-панель -->
<div id="adminPanel" class="hidden">
  <!-- Хедер -->
  <header class="bg-slate-900/90 backdrop-blur-lg border-b border-white/10 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4">
      <div class="flex justify-between items-center">
        <div>
          <h1 class="text-2xl font-bold">👑 Админ-панель</h1>
          <p class="text-sm text-slate-400">Управление магазином BeerShop</p>
        </div>
        <div class="flex gap-3">
          <a href="index.html" target="_blank" class="btn-primary text-sm px-4 py-2">
            🌐 На сайт
          </a>
          <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-lg font-semibold hover:bg-red-600 transition">
            Выйти
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="max-w-7xl mx-auto p-4">
    <!-- Табы -->
    <div class="flex gap-4 border-b border-white/10 mb-6">
      <button class="tab-btn active" onclick="switchTab('products')">📦 Товары</button>
      <button class="tab-btn" onclick="switchTab('orders')">
        📋 Заказы <span id="orderBadge" class="bg-red-500 text-white text-xs px-2 py-1 rounded-full ml-1">0</span>
      </button>
      <button class="tab-btn" onclick="switchTab('stats')">📊 Статистика</button>
    </div>

    <!-- Вкладка: Товары -->
    <div id="productsTab">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-3xl font-bold">Каталог товаров</h2>
        <button onclick="showAddForm()" class="btn-primary">
          ➕ Добавить товар
        </button>
      </div>
      <div id="productsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </div>

    <!-- Вкладка: Заказы -->
    <div id="ordersTab" class="hidden">
      <h2 class="text-3xl font-bold mb-6">Заказы</h2>
      <div id="ordersList"></div>
    </div>

    <!-- Вкладка: Статистика -->
    <div id="statsTab" class="hidden">
      <h2 class="text-3xl font-bold mb-6">Статистика</h2>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
        <div class="card bg-gradient-to-br from-blue-500 to-blue-600">
          <div class="text-4xl mb-2">📋</div>
          <div class="text-sm opacity-80">Всего заказов</div>
          <div class="text-3xl font-bold" id="statTotal">0</div>
        </div>
        <div class="card bg-gradient-to-br from-green-500 to-green-600">
          <div class="text-4xl mb-2">✅</div>
          <div class="text-sm opacity-80">Выполнено</div>
          <div class="text-3xl font-bold" id="statCompleted">0</div>
        </div>
        <div class="card bg-gradient-to-br from-red-500 to-red-600">
          <div class="text-4xl mb-2">❌</div>
          <div class="text-sm opacity-80">Отменено</div>
          <div class="text-3xl font-bold" id="statCancelled">0</div>
        </div>
        <div class="card bg-gradient-to-br from-amber-500 to-orange-500">
          <div class="text-4xl mb-2">💰</div>
          <div class="text-sm opacity-80">Выручка</div>
          <div class="text-3xl font-bold" id="statRevenue">0₽</div>
        </div>
      </div>
      <div id="statsHistory"></div>
    </div>
  </div>
</div>

<!-- Модалка товара -->
<div id="productModal" class="modal">
  <div class="modal-content p-6">
    <h3 class="text-2xl font-bold mb-6" id="modalTitle">Добавить товар</h3>
    
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-semibold mb-2">Изображение (URL)</label>
        <input type="text" id="productImage" placeholder="https://..." class="input-field">
      </div>

      <div>
        <label class="block text-sm font-semibold mb-2">Название</label>
        <input type="text" id="productName" placeholder="IPA Classic" class="input-field">
      </div>

      <div>
        <label class="block text-sm font-semibold mb-2">Описание</label>
        <textarea id="productDesc" placeholder="0.5л • 6.5%" class="input-field" rows="2"></textarea>
      </div>

      <div>
        <label class="block text-sm font-semibold mb-2">Категория</label>
        <select id="productCategory" class="input-field">
          <option value="Пиво">🍺 Пиво</option>
          <option value="Крафтовое пиво">🍻 Крафтовое пиво</option>
          <option value="Сидр">🍎 Сидр</option>
          <option value="Закуски">🥨 Закуски</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-semibold mb-2">Цена (₽)</label>
        <input type="number" id="productPrice" placeholder="350" class="input-field" min="0">
      </div>

      <div class="flex items-center gap-2">
        <input type="checkbox" id="productIsNew" class="w-5 h-5">
        <label for="productIsNew" class="font-semibold">Отметить как новинку</label>
      </div>
    </div>

    <div class="flex gap-3 mt-6">
      <button onclick="saveProduct()" class="flex-1 btn-primary">
        ✅ Сохранить
      </button>
      <button onclick="closeModal()" class="flex-1 bg-slate-700 text-white py-3 rounded-lg font-bold hover:bg-slate-600 transition">
        Отмена
      </button>
    </div>
  </div>
</div>

<script>
const ADMIN_PASSWORD = 'admin123';
let products = [];
let orders = [];
let editingIndex = null;

function init() {
  loadProducts();
  loadOrders();
  checkAuth();
  updateOrderBadge();
}

function checkAuth() {
  const isAuth = sessionStorage.getItem('adminAuth');
  if (isAuth === 'true') {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('adminPanel').classList.remove('hidden');
    renderProducts();
    renderOrders();
    renderStats();
  } else {
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('adminPanel').classList.add('hidden');
  }
}

function checkPassword() {
  const password = document.getElementById('passwordInput').value;
  if (password === ADMIN_PASSWORD) {
    sessionStorage.setItem('adminAuth', 'true');
    checkAuth();
    showToast('Добро пожаловать!');
  } else {
    showToast('Неверный пароль!', 'error');
  }
}

function logout() {
  sessionStorage.removeItem('adminAuth');
  checkAuth();
  document.getElementById('passwordInput').value = '';
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  
  document.getElementById('productsTab').classList.toggle('hidden', tab !== 'products');
  document.getElementById('ordersTab').classList.toggle('hidden', tab !== 'orders');
  document.getElementById('statsTab').classList.toggle('hidden', tab !== 'stats');
  
  if (tab === 'orders') renderOrders();
  if (tab === 'stats') renderStats();
}

function loadProducts() {
  const stored = localStorage.getItem('products');
  products = stored ? JSON.parse(stored) : [];
}

function saveProducts() {
  localStorage.setItem('products', JSON.stringify(products));
}

function loadOrders() {
  const stored = localStorage.getItem('orders');
  orders = stored ? JSON.parse(stored) : [];
}

function saveOrders() {
  localStorage.setItem('orders', JSON.stringify(orders));
  updateOrderBadge();
}

function updateOrderBadge() {
  const newOrders = orders.filter(o => o.status === 'new').length;
  document.getElementById('orderBadge').textContent = newOrders;
}

function renderProducts() {
  const container = document.getElementById('productsList');
  if (products.length === 0) {
    container.innerHTML = '<div class="col-span-full text-center py-12 text-slate-400"><p class="text-xl mb-4">📦 Товаров пока нет</p></div>';
    return;
  }
  
  container.innerHTML = products.map((product, index) => `
    <div class="card">
      <img src="${product.image}" class="w-full h-48 object-cover rounded-lg mb-4" onerror="this.src='https://via.placeholder.com/400x300?text=Beer'">
      <div class="flex justify-between items-start mb-2">
        <h3 class="font-bold text-lg">${product.name}</h3>
        ${product.isNew ? '<span class="bg-green-500 text-white text-xs px-2 py-1 rounded">NEW</span>' : ''}
      </div>
      <p class="text-sm text-slate-400 mb-2">${product.desc}</p>
      <p class="text-xs text-slate-500 mb-3">${product.category}</p>
      <p class="text-2xl font-bold text-amber-400 mb-4">${product.price} ₽</p>
      <div class="flex gap-2">
        <button onclick="editProduct(${index})" class="flex-1 bg-blue-500 text-white py-2 rounded-lg font-semibold hover:bg-blue-600 transition text-sm">
          ✏️ Изменить
        </button>
        <button onclick="deleteProduct(${index})" class="flex-1 bg-red-500 text-white py-2 rounded-lg font-semibold hover:bg-red-600 transition text-sm">
          🗑️ Удалить
        </button>
      </div>
    </div>
  `).join('');
}

function renderOrders() {
  const container = document.getElementById('ordersList');
  const newOrders = orders.filter(o => o.status === 'new');
  
  if (newOrders.length === 0) {
    container.innerHTML = '<div class="text-center py-12 text-slate-400"><p class="text-xl">📭 Новых заказов нет</p></div>';
    return;
  }
  
  container.innerHTML = newOrders.map(order => `
    <div class="card mb-4">
      <div class="flex justify-between items-start mb-4">
        <div>
          <h3 class="font-bold text-lg">Заказ #${order.id}</h3>
          <p class="text-sm text-slate-400">${order.date}</p>
        </div>
        <span class="bg-amber-500 text-black px-3 py-1 rounded-full text-sm font-bold">Новый</span>
      </div>
      
      <div class="space-y-2 mb-4">
        <p><strong>👤 Имя:</strong> ${order.name}</p>
        <p><strong>📞 Телефон:</strong> ${order.phone}</p>
        ${order.comment ? `<p><strong>💬 Комментарий:</strong> ${order.comment}</p>` : ''}
        <p><strong>💰 Сумма:</strong> ${order.total} ₽</p>
      </div>
      
      <div class="border-t border-white/10 pt-3 mb-4">
        <p class="font-semibold mb-2">Товары:</p>
        ${order.items.map(item => `<p class="text-sm text-slate-300">• ${item.name} x${item.count} = ${item.total}₽</p>`).join('')}
      </div>
      
      <div class="flex gap-2">
        <button onclick="completeOrder(${orders.indexOf(order)})" class="flex-1 bg-green-500 text-white py-3 rounded-lg font-bold hover:bg-green-600 transition">
          ✅ Выполнен
        </button>
        <button onclick="cancelOrder(${orders.indexOf(order)})" class="flex-1 bg-red-500 text-white py-3 rounded-lg font-bold hover:bg-red-600 transition">
          ❌ Отменить
        </button>
      </div>
    </div>
  `).join('');
}

function completeOrder(index) {
  orders[index].status = 'completed';
  saveOrders();
  renderOrders();
  renderStats();
  showToast('Заказ выполнен!');
}

function cancelOrder(index) {
  orders[index].status = 'cancelled';
  saveOrders();
  renderOrders();
  renderStats();
  showToast('Заказ отменён', 'error');
}

function renderStats() {
  const completed = orders.filter(o => o.status === 'completed');
  const cancelled = orders.filter(o => o.status === 'cancelled');
  const revenue = completed.reduce((sum, o) => sum + o.total, 0);
  
  document.getElementById('statTotal').textContent = orders.length;
  document.getElementById('statCompleted').textContent = completed.length;
  document.getElementById('statCancelled').textContent = cancelled.length;
  document.getElementById('statRevenue').textContent = revenue + '₽';
  
  const container = document.getElementById('statsHistory');
  const history = orders.filter(o => o.status !== 'new');
  
  if (history.length === 0) {
    container.innerHTML = '<div class="card text-center text-slate-400"><p>История заказов пуста</p></div>';
    return;
  }
  
  container.innerHTML = `
    <h3 class="text-xl font-bold mb-4">История заказов</h3>
    ${history.map(order => `
      <div class="card mb-3">
        <div class="flex justify-between items-center">
          <div>
            <p class="font-semibold">Заказ #${order.id}</p>
            <p class="text-sm text-slate-400">${order.date} • ${order.total}₽</p>
          </div>
          <span class="px-3 py-1 rounded-full text-sm font-bold ${order.status === 'completed' ? 'bg-green-500' : 'bg-red-500'}">
            ${order.status === 'completed' ? '✅ Выполнен' : '❌ Отменён'}
          </span>
        </div>
      </div>
    `).join('')}
  `;
}

function showAddForm() {
  editingIndex = null;
  document.getElementById('modalTitle').textContent = 'Добавить товар';
  document.getElementById('productName').value = '';
  document.getElementById('productDesc').value = '';
  document.getElementById('productImage').value = '';
  document.getElementById('productCategory').value = 'Пиво';
  document.getElementById('productPrice').value = '';
  document.getElementById('productIsNew').checked = false;
  document.getElementById('productModal').classList.add('active');
}

function editProduct(index) {
  editingIndex = index;
  const product = products[index];
  document.getElementById('modalTitle').textContent = 'Редактировать товар';
  document.getElementById('productName').value = product.name;
  document.getElementById('productDesc').value = product.desc;
  document.getElementById('productImage').value = product.image;
  document.getElementById('productCategory').value = product.category;
  document.getElementById('productPrice').value = product.price;
  document.getElementById('productIsNew').checked = product.isNew || false;
  document.getElementById('productModal').classList.add('active');
}

function saveProduct() {
  const name = document.getElementById('productName').value.trim();
  const desc = document.getElementById('productDesc').value.trim();
  const image = document.getElementById('productImage').value.trim();
  const category = document.getElementById('productCategory').value;
  const price = parseInt(document.getElementById('productPrice').value) || 0;
  const isNew = document.getElementById('productIsNew').checked;
  
  if (!name || !image) {
    showToast('Заполните все поля!', 'error');
    return;
  }
  
  const product = { name, desc, image, category, price, isNew };
  
  if (editingIndex !== null) {
    products[editingIndex] = product;
    showToast('Товар обновлён!');
  } else {
    products.push(product);
    showToast('Товар добавлен!');
  }
  
  saveProducts();
  closeModal();
  renderProducts();
}

function deleteProduct(index) {
  if (confirm('Удалить товар?')) {
    products.splice(index, 1);
    saveProducts();
    renderProducts();
    showToast('Товар удалён!');
  }
}

function closeModal() {
  document.getElementById('productModal').classList.remove('active');
}

function showToast(message, type = 'success') {
  const toast = document.createElement('div');
  toast.style.cssText = `
    position: fixed;
    top: 20px;
    right: 20px;
    background: ${type === 'success' ? 'linear-gradient(135deg, #10b981, #059669)' : 'linear-gradient(135deg, #ef4444, #dc2626)'};
    color: white;
    padding: 16px 24px;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    z-index: 9999;
    font-weight: 600;
  `;
  toast.textContent = message;
  document.body.appendChild(toast);
  
  setTimeout(() => toast.remove(), 3000);
}

init();
</script>

</body>
</html>
